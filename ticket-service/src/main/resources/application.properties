spring.application.name=ticket-service
server.port=8058

spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/mingle
spring.datasource.username=postgres
spring.datasource.password=197235
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.cloud.discovery.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://mingle:mingle@eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true
