spring.application.name=a2srv-service
server.port=8051

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mingle}
spring.datasource.username=${DB_USERNAME:mingle}
spring.datasource.password=${DB_PASSWORD:mingle_local}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.refresh-expiration=604800000
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.cloud.discovery.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://mingle:mingle@eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true

gateway.token-blacklist-url=http://api-gateway/internal/token/blacklist

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

gateway.internal-api-key=${INTERNAL_API_KEY}

# Optional: the account with this email is made ADMIN at startup (it must already be registered)
admin.email=${ADMIN_EMAIL:}
