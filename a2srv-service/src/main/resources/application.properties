spring.application.name=a2srv-service
server.port=8051

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mingle}
spring.datasource.username=${DB_USERNAME:mingle}
spring.datasource.password=${DB_PASSWORD:mingle_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema is owned by Flyway (db/migration); Hibernate only validates it. The database is shared, so keep
# a history table per service and baseline at 0 so V1 still runs against a non-empty schema.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.table=flyway_schema_history_a2srv
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.refresh-expiration=604800000
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.cloud.discovery.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://mingle:mingle@eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true

gateway.token-blacklist-url=http://api-gateway/internal/token/blacklist

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

gateway.internal-api-key=${INTERNAL_API_KEY}

# Optional: the account with this email is made ADMIN at startup (it must already be registered)
admin.email=${ADMIN_EMAIL:}

# Email verification. SMTP_* point at a real provider in production; docker compose uses MailHog.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
mail.from=${MAIL_FROM:no-reply@mingle.local}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
verification.ttl-hours=24
# An unreachable SMTP server must not make the service unhealthy
management.health.mail.enabled=false
