version: '3.8'

services:

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "admin"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mingle-net

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: eureka-server.Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mingle-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: gateway-server.Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mingle-net

  a2srv-service:
    build:
      context: ./a2srv-service
      dockerfile: a2srv-service.Dockerfile
    container_name: a2srv-service
    ports:
      - "8051:8051"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8051/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mingle-net

  event-service:
    build:
      context: ./event-service
      dockerfile: event-service.Dockerfile
    container_name: event-service
    ports:
      - "8090:8090"
    environment:
      - TICKETMASTER_API_KEY=${TICKETMASTER_API_KEY:-8hJOZzccB7zG4slE2HxkTg9tjG1E8uyg}
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      a2srv-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mingle-net


  ticket-service:
    build:
      context: ./ticket-service
      dockerfile: ticket-service.Dockerfile
    container_name: ticket-service
    ports:
      - "8058:8058"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      a2srv-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8058/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mingle-net

networks:
  mingle-net:
    driver: bridge
