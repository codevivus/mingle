services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: mingle
      POSTGRES_USER: ${DB_USERNAME:-mingle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mingle_local}
    volumes:
      - mingle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mingle} -d mingle"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mingle-net

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-mingle_local}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mingle_local}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mingle-net

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: eureka-server.Dockerfile
    container_name: eureka-server
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mingle-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: gateway-server.Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mingle_local}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in your .env file - see .env.example}
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mingle-net

  a2srv-service:
    build:
      context: ./a2srv-service
      dockerfile: a2srv-service.Dockerfile
    container_name: a2srv-service
    ports:
      - "127.0.0.1:8051:8051"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mingle
      DB_USERNAME: ${DB_USERNAME:-mingle}
      DB_PASSWORD: ${DB_PASSWORD:-mingle_local}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file - see .env.example}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in your .env file - see .env.example}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8051/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mingle-net

  event-service:
    build:
      context: ./event-service
      dockerfile: event-service.Dockerfile
    container_name: event-service
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mingle
      DB_USERNAME: ${DB_USERNAME:-mingle}
      DB_PASSWORD: ${DB_PASSWORD:-mingle_local}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      a2srv-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mingle-net

  ticket-service:
    build:
      context: ./ticket-service
      dockerfile: ticket-service.Dockerfile
    container_name: ticket-service
    ports:
      - "127.0.0.1:8058:8058"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mingle
      DB_USERNAME: ${DB_USERNAME:-mingle}
      DB_PASSWORD: ${DB_PASSWORD:-mingle_local}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      a2srv-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8058/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mingle-net

volumes:
  mingle-postgres-data:

networks:
  mingle-net:
    driver: bridge
