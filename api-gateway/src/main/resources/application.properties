spring.application.name=api-gateway
server.port=8080
spring.main.web-application-type=reactive

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:mingle_local}

spring.cloud.discovery.enabled=true
eureka.client.serviceUrl.register-with-eureka=true
eureka.client.serviceUrl.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://mingle:mingle@eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.mingle=DEBUG

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

auth.service.validate-url=http://a2srv-service/auth/validate

internal.api-key=${INTERNAL_API_KEY:}

# Circuit breakers: Resilience4j defaults for every CircuitBreaker route filter
resilience4j.timelimiter.configs.default.timeoutDuration=15s
resilience4j.circuitbreaker.configs.default.slidingWindowSize=20
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
