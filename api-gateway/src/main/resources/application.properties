spring.application.name=api-gateway
server.port=8080
spring.main.web-application-type=reactive

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=mingle

spring.cloud.discovery.enabled=true
eureka.client.serviceUrl.register-with-eureka=true
eureka.client.serviceUrl.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://mingle:mingle@eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.mingle=DEBUG

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

auth.service.validate-url=http://a2srv-service/auth/validate
