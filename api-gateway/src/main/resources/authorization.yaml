authorization:
  whitelist-paths:
    - /auth/login
    - /auth/validate
    - /user/register
    - /user/check-email
    - /user/check-username
    - /actuator/health
    - /v3/api-docs
    - /swagger-ui.html
    - /swagger-ui/**
    - /webjars/**

  # Every API route gets a per-caller rate limit (X-User-Id, else client IP) and a circuit breaker that
  # answers 503 from /fallback/{service}. Swagger and the WebSocket route skip the circuit breaker.
  routes:
    - id: auth-service
      path: /auth/**
      uri: lb://a2srv-service
      filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 5
            redis-rate-limiter.burstCapacity: 10
        - name: CircuitBreaker
          args:
            name: authCB
            fallbackUri: forward:/fallback/auth

    - id: user-service
      path: /user/**
      uri: lb://a2srv-service
      filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 5
            redis-rate-limiter.burstCapacity: 10
        - name: CircuitBreaker
          args:
            name: userCB
            fallbackUri: forward:/fallback/user

    - id: event-service
      path: /event/**
      uri: lb://event-service
      filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
        - name: CircuitBreaker
          args:
            name: eventCB
            fallbackUri: forward:/fallback/event

    - id: swagger-docs
      path: /v3/api-docs/**
      uri: lb://a2srv-service

    - id: swagger-ui
      path: /swagger-ui/**
      uri: lb://a2srv-service

    - id: swagger-static
      path: /webjars/**
      uri: lb://a2srv-service

    - id: match-service
      path: /match/**
      uri: lb://match-service
      filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
        - name: CircuitBreaker
          args:
            name: matchCB
            fallbackUri: forward:/fallback/match

    - id: chat-service
      path: /chat/**
      uri: lb://match-service
      filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
        - name: CircuitBreaker
          args:
            name: chatCB
            fallbackUri: forward:/fallback/chat

    - id: chat-websocket
      path: /ws/**
      uri: lb:ws://match-service
      filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 5
            redis-rate-limiter.burstCapacity: 10

    - id: ticket-service
      path: /ticket/**
      uri: lb://ticket-service
      filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
        - name: CircuitBreaker
          args:
            name: ticketCB
            fallbackUri: forward:/fallback/ticket

  cors:
    allowed-origins:
      - https://localhost:4200
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Authorization
      - X-Request-ID
