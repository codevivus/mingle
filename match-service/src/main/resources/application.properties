spring.application.name=match-service
server.port=8095

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mingle}
spring.datasource.username=${DB_USERNAME:mingle}
spring.datasource.password=${DB_PASSWORD:mingle_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema is owned by Flyway. The database is shared with other services, so keep our own
# history table and baseline at 0 so V1 still runs against a non-empty schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.table=flyway_schema_history_match
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.cloud.discovery.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://mingle:mingle@eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

logging.level.com.mingle=DEBUG

# Chat: sending stops lock-after-hours after the event ends; the history stays readable for read-only-days more,
# then it is locked too. Unlocking goes through ChatUnlockService.
chat.event-time-zone=${EVENT_TIME_ZONE:Europe/Istanbul}
chat.lock-after-hours=${CHAT_LOCK_AFTER_HOURS:24}
chat.read-only-days=${CHAT_READ_ONLY_DAYS:30}
chat.unlock.provider=${CHAT_UNLOCK_PROVIDER:stub}
ws.allowed-origin-patterns=${WS_ALLOWED_ORIGINS:https://localhost:4200,http://localhost:4200}
