spring.application.name=event-service
server.port=8090

ticketmaster.api.base-url=https://app.ticketmaster.com/discovery/v2
ticketmaster.api.key=${TICKETMASTER_API_KEY:}
ticketmaster.api.size=50
ticketmaster.api.import-cron=0 0 3 * * *

cleanup.cron=0 0 4 * * *
cleanup.expired-days=7

async.executor.core-pool-size=5
async.executor.max-pool-size=5
async.executor.queue-capacity=50
async.executor.thread-name-prefix=event-importer-

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mingle}
spring.datasource.username=${DB_USERNAME:mingle}
spring.datasource.password=${DB_PASSWORD:mingle_local}
spring.datasource.driver-class-name=org.postgresql.Driver
# The schema is owned by Flyway (db/migration); Hibernate only validates it. The database is shared, so keep
# a history table per service and baseline at 0 so V1 still runs against a non-empty schema.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.table=flyway_schema_history_event
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.cloud.discovery.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://mingle:mingle@eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true

ticketmaster.api.retryDefaultDelaySeconds=2
ticketmaster.api.retryMaxAttempts=3

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

